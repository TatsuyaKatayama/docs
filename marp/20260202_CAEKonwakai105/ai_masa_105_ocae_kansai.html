<h1 id="%E8%87%AA%E5%B7%B1%E7%B4%B9%E4%BB%8B-2">自己紹介</h1>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-footer="第105回 関西CAE懇話会" data-paginate="true" data-class="cc-by-sa" data-theme="blue" lang="en-US" class="cc-by-sa" data-marpit-pagination="5" style="--footer:第105回 関西CAE懇話会;--paginate:true;--class:cc-by-sa;--theme:blue;" data-marpit-pagination-total="28" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="%E8%A8%AD%E8%A8%88%E8%80%85cae%E3%81%AE%E5%AE%9A%E7%BE%A9-1">設計者CAEの定義</h1>
<p>企業におけるCAEは、初めてもしくはまだ実現できておらず技術的に未確立な<strong>未確立CAE</strong>と、すでに精度確認されて実使用できる<strong>確立済みCAE</strong>を分類できる。</p>
<div class="mermaid-wrap h-400">
<pre class="mermaid">

graph LR
    subgraph CAE全体
        subgraph 未確立["未確立CAE"]
            TS[トラブルシューティング]
            現象[現象メカニズム分析]
            設計未[設計アイデアを試す]
        end

        subgraph 確立["確立済みCAE"]
            モデル[既存モデルで計算]
            過去[過去設計で適用済み]
            基準[設計基準内か確認]
        end
        
    end
    
    style 設計未 fill:#ffcccc,stroke:#ff0000,stroke-width:1px
    style モデル fill:#ffcccc,stroke:#ff0000,stroke-width:1px
    style 過去 fill:#ffcccc,stroke:#ff0000,stroke-width:1px
    style 基準 fill:#ffcccc,stroke:#ff0000,stroke-width:1px
</pre>
</div>
<p><strong>設計者CAEの定義を設計仕様を検討するためのCAE</strong>とすると、<br />
設計者CAEは、<strong>確立済みCAE</strong>のみならず、<strong>未確立CAE</strong>にも設計者CAEは存在する。</p>
<footer>第105回 関西CAE懇話会</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-footer="第105回 関西CAE懇話会" data-paginate="true" data-class="cc-by-sa" data-theme="blue" lang="en-US" class="cc-by-sa" data-marpit-pagination="6" style="--footer:第105回 関西CAE懇話会;--paginate:true;--class:cc-by-sa;--theme:blue;" data-marpit-pagination-total="28" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="%E6%9C%AA%E7%A2%BA%E7%AB%8Bcae-%C3%97-%E8%A8%AD%E8%A8%88%E6%A4%9C%E8%A8%8E">未確立CAE × 設計検討</h1>
<h2 id="%E8%A8%AD%E8%A8%88%E8%80%85%E3%81%AE%E5%9B%B0%E3%82%8A%E3%81%94%E3%81%A8">設計者の困りごと</h2>
<p>新しいアイデアを思いついても、検証する手段も時間もなく前に進めない。仕方なく、お蔵入りに。</p>
<div style="display: flex; align-items: center; justify-content: center; margin-top: 10px; margin-bottom: 10px;">
<div style="flex: 1; text-align: center;">
<img src="data/kaisya_man_bad.png" alt="設計者" style="width: 300px;" />
</div>
<div style="flex: 2;">
<div style="background-color: #f0f0f0; border-radius: 20px; padding: 30px; position: relative; margin-left: 30px;">
<div style="position: absolute; left: -50px; top: 50%; width: 0; height: 0; border-top: 20px solid transparent; border-bottom: 20px solid transparent; border-right: 60px solid #f0f0f0;"></div>
<p><strong>新しいアイデアを試す手段がない...</strong></p>
<ul>
<li>✗ 確立済みCAE → 範囲外で使えない</li>
<li>△ 実験 → 高コスト・時間がかかる</li>
<li>✗ お蔵入り → イノベーションが止まる</li>
</ul>
<p><strong>どうやって試せばいいのか？</strong></p>
</div>
</div>
</div>
<h2 id="%E8%A8%AD%E8%A8%88%E8%80%85%E6%9C%AC%E5%BD%93%E3%81%AB%E6%AC%B2%E3%81%97%E3%81%84%E3%82%82%E3%81%AE">設計者本当に欲しいもの</h2>
<ul>
<li>
<p><strong>設計者が本当に欲しいのは「勝ち目があるかどうか」「時間とお金を投資する価値があるかどうか」の判断材料。</strong></p>
</li>
<li>
<p><strong>計算で傾向が見れるのであれば、あとは何とかできる。</strong></p>
</li>
</ul>
<footer>第105回 関西CAE懇話会</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-footer="第105回 関西CAE懇話会" data-paginate="true" data-class="cc-by-sa" data-theme="blue" lang="en-US" class="cc-by-sa" data-marpit-pagination="7" style="--footer:第105回 関西CAE懇話会;--paginate:true;--class:cc-by-sa;--theme:blue;" data-marpit-pagination-total="28" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="%E6%9C%AA%E7%A2%BA%E7%AB%8Bcae-%C3%97-%E8%A8%AD%E8%A8%88%E6%A4%9C%E8%A8%8E-1">未確立CAE × 設計検討</h1>
<h2 id="q-%E3%81%A9%E3%81%86%E3%81%99%E3%82%8C%E3%81%B0%E3%82%A2%E3%82%A4%E3%83%87%E3%82%A2%E3%82%92%E8%A9%A6%E3%81%9B%E3%82%8B%E3%81%AE%E3%81%8B">Q どうすればアイデアを試せるのか？</h2>
<div class="answer-box">
  <input type="checkbox" id="a" />
  <label for="a">A. 設計者が自分で設計に必要な計算を作る</label>
  <div class="explain-red">❌ できれば困らない。計算作りながら設計もすると時間がない。</div>
</div>
<div class="answer-box">

<h1 id="%E7%A2%BA%E7%AB%8B%E6%B8%88%E3%81%BFcae-%C3%97-%E8%A8%AD%E8%A8%88%E6%A4%9C%E8%A8%8E-%E4%BA%8B%E4%BE%8B%EF%BC%92">確立済みCAE × 設計検討　事例２</h1>
<h2 id="%E5%89%8D%E5%90%91%E3%81%8D%E3%81%AA%E8%A8%AD%E8%A8%88%E6%A4%9C%E8%A8%8E%E7%B7%A8%E3%81%82%E3%82%8B%E6%97%A5%E3%81%AE%E4%BA%8B%E5%8B%99%E6%89%80%E3%81%AB%E3%81%A6">前向きな設計検討編（ある日の事務所にて）</h2>
<h3 id="%E5%BF%85%E8%A6%81%E3%81%AA%E6%8A%80%E8%A1%93%E3%81%A8%E8%A6%8B%E5%AE%9A%E3%82%81%E3%82%8B%E3%81%9F%E3%82%81%E3%81%ABcae%E3%82%92%E6%B4%BB%E7%94%A8%E6%9C%AC%E5%BD%93%E3%81%AB%E6%AC%B2%E3%81%97%E3%81%84%E3%82%82%E3%81%AE%E3%81%AF%E3%83%84%E3%83%BC%E3%83%AB%E3%81%A7%E3%81%AF%E3%81%AA%E3%81%8F%E6%A4%9C%E8%A8%8E%E3%81%A7%E3%81%8D%E3%82%8B%E6%8A%80%E8%A1%93%E8%80%85">必要な技術と見定めるためにCAEを活用。本当に欲しいものはツールではなく、検討できる技術者。</h3>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 0px;">
<div style="flex: 1; text-align: center;">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-fragments="1" data-footer="第105回 関西CAE懇話会" data-paginate="true" data-class="cc-by-sa" data-theme="blue" lang="en-US" class="cc-by-sa" data-marpit-pagination="13" style="--footer:第105回 関西CAE懇話会;--paginate:true;--class:cc-by-sa;--theme:blue;" data-marpit-pagination-total="28" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="%E7%A2%BA%E7%AB%8B%E6%B8%88%E3%81%BFcae-%C3%97-%E8%A8%AD%E8%A8%88%E6%A4%9C%E8%A8%8E-%E3%81%BE%E3%81%A8%E3%82%81">確立済みCAE × 設計検討　まとめ</h1>
<h2 id="%E3%81%BE%E3%81%A8%E3%82%81">まとめ</h2>
<ul>
<li>事例から分かる現状：設計者は「手早く答えが欲しい」が、時間がなく自ら計算する余裕はない。</li>
<li>CAE専任者側も手順やノウハウはあるが、依頼対応だけでは設計意図・制約を汲めず最良の提案が出しにくい。</li>
<li>依頼→回答の一方向ではイノベーションが止まり、設計検討の質が下がるリスクがある。</li>
<li>本当に必要なのは「ツール」ではなく「設計検討を一緒に行える人」：
<ul>
<li>早く傾向を出して判断材料を提供できる人（＝設計とCAEの橋渡し）</li>
<li>設計者と議論しながら試行を進められる技術者</li>
<li>短時間で使えるライトウェイトな検討フローを回せる人材</li>
</ul>
</li>
</ul>
<h2 id="%E3%81%93%E3%81%93%E3%81%BE%E3%81%A7%E3%81%AE%E7%B5%90%E8%AB%96">ここまでの結論</h2>
<ul>
<li>設計検討の核は「人（協業できる技術者）」であり、ツールはその補助に過ぎない。</li>
</ul>
<ul>
<li data-marpit-fragment="1"><strong>なら、それ(設計検討)AIにやらせてみませんか？</strong></li>
</ul>
<footer>第105回 関西CAE懇話会</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-footer="第105回 関西CAE懇話会" data-paginate="true" data-class="cc-by-sa" data-theme="blue" lang="en-US" class="cc-by-sa" data-marpit-pagination="14" style="--footer:第105回 関西CAE懇話会;--paginate:true;--class:cc-by-sa;--theme:blue;" data-marpit-pagination-total="28" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="llm%E3%81%AE%E6%8A%80%E8%A1%93%E9%80%B2%E5%B1%95%E3%81%A8%E8%A8%AD%E8%A8%88%E6%A4%9C%E8%A8%8E%E3%81%AB%E5%BF%85%E8%A6%81%E3%81%AA%E3%82%B9%E3%82%AD%E3%83%AB%E3%81%9D%E3%81%97%E3%81%A6%E4%BB%8A%E3%82%84%E3%82%8B%E3%81%93%E3%81%A8-1">LLMの技術進展と設計検討に必要なスキル、そして今やること</h1>
<h2 id="llm%E3%81%AE%E6%8A%80%E8%A1%93%E9%80%B2%E5%B1%95">LLMの技術進展</h2>
<ul>
<li><strong>トランスフォーマ</strong>／大規模事前学習による汎化能力向上／長文コンテキスト／マルチモーダル対応</li>
<li><strong>ツール利用</strong>（CLI・API呼び出し・プラグイン）による外部操作能力</li>
<li><strong>マルチエージェント協調</strong></li>
</ul>
<h2 id="%E8%A8%AD%E8%A8%88%E6%A4%9C%E8%A8%8E%E3%81%AB%E5%BF%85%E8%A6%81%E3%81%AA%E3%82%B9%E3%82%AD%E3%83%AB%E4%B8%80%E4%BE%8B">設計検討に必要なスキル（一例）</h2>
<p>まさの発言「<strong>効率は0.5pt上がるけど、軸受け部の信頼性が厳しいっすわ。片当たり押さえたらな、あかん</strong>」によると</p>
<ol>
<li><strong>設計変数を変えたときの目的関数の予測計算</strong>ができる(CAE)</li>
<li><strong>他に何を考慮しないといけないか</strong>を、わかっている</li>
<li>対策を知っていて、考慮したら解が存在しうることを知っている。<strong>（逆問題が解ける）</strong></li>
</ol>
<h2 id="bigtech%E3%81%AB%E8%B2%A0%E3%81%91%E3%81%AA%E3%81%84%E3%81%9F%E3%82%81%E3%81%AE%E5%B7%AE%E5%88%A5%E5%8C%96%E6%88%A6%E7%95%A5">BigTechに負けないための差別化戦略</h2>
<ul>
<li><strong>設計検討に必要なスキル</strong>を持たせた<strong>マルチエージェント</strong>戦略。
<ul>
<li>狙いは<strong>多目的な性能</strong>（効率、信頼性、コスト）を<strong>多様な立場</strong>（設計者、照査者、審議者）で<strong>議論</strong>。</li>
<li><strong>検討を行うチーム構成</strong>もBigTechにない<strong>企業固有のもの</strong>。</li>
<li>一方、<strong>個々のエージェントの基本性能向上はBigTechに任せる</strong></li>
</ul>
</li>
</ul>
<footer>第105回 関西CAE懇話会</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-footer="第105回 関西CAE懇話会" data-paginate="true" data-class="cc-by-sa" data-theme="blue" lang="en-US" class="cc-by-sa" data-marpit-pagination="15" style="--footer:第105回 関西CAE懇話会;--paginate:true;--class:cc-by-sa;--theme:blue;" data-marpit-pagination-total="28" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="%F0%9F%A4%96-ai-masa-%E8%A8%AD%E8%A8%88%E6%A4%9C%E8%A8%8E%E3%82%A8%E3%83%BC%E3%82%B8%E3%82%A7%E3%83%B3%E3%83%88"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f916.svg" data-marp-twemoji=""/> ai-masa 設計検討エージェント</h1>
<h2 id="%E3%83%97%E3%83%AD%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88%E6%A6%82%E8%A6%81">プロジェクト概要</h2>
<p><code>ai-masa</code> は、複数のLLMエージェントが協調してタスクを遂行する分散型マルチエージェントシステムである。</p>
<ul>
<li>通信基盤: Redis Pub/Sub — 各エージェントは独立プロセスとして動作</li>
<li>メモリ管理: Redis (RedisJSON) 上の <code>MemoryManager</code> が対話履歴と各エージェントの状態を一元管理・永続化</li>
<li>入力経路: <code>UserInputAgent</code> がユーザー指示を受け取り、目的に応じて思考エージェントへルーティング</li>
<li>思考エージェント例: <code>GeminiCliAgent</code>, <code>OpencodeAgent</code>, <code>RoleBasedAgent</code> などが応答・処理を担当</li>
<li>ロギング: <code>LoggingAgent</code> が全通信を記録し、後から対話内容を確認・分析可能</li>
<li>2026/2/6現在。各エージェントはシングルタスクしか実行できない。</li>
<li>masa の名称由来: &quot;Multi Agents System Assistant&quot; または &quot;Mechanism Analysis and Structuring Assistant&quot; の頭文字</li>
</ul>
<h3 id="hp">HP</h3>
<ul>
<li>HP: <a href="https://github.com/TatsuyaKatayama/ai_masa">https://github.com/TatsuyaKatayama/ai_masa</a></li>
<li>License: MIT</li>
<li>Star 1</li>
</ul>
<footer>第105回 関西CAE懇話会</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-footer="第105回 関西CAE懇話会" data-paginate="true" data-class="cc-by-sa" data-theme="blue" lang="en-US" class="cc-by-sa" data-marpit-pagination="16" style="--footer:第105回 関西CAE懇話会;--paginate:true;--class:cc-by-sa;--theme:blue;" data-marpit-pagination-total="28" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="%F0%9F%A4%96-ai-masa-%E2%9A%99%EF%B8%8F-%E3%82%B7%E3%82%B9%E3%83%86%E3%83%A0%E3%82%A2%E3%83%BC%E3%82%AD%E3%83%86%E3%82%AF%E3%83%81%E3%83%A3"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f916.svg" data-marp-twemoji=""/> ai-masa <img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2699.svg" data-marp-twemoji=""/> システムアーキテクチャ</h1>
<p><code>ai-masa</code>は、Pub/Subモデルに基づいた柔軟なマルチエージェントアーキテクチャを採用しています。<br />
中心的なメッセージブローカー（Redis）を介して、各エージェントが他のエージェントと非同期に通信します。</p>
<div class="columns-60-40">
<div class="column">
<pre class="mermaid">
graph TD
    subgraph "User Interaction"
        UserInput[UserInputAgent]
    end

    subgraph "Core Infrastructure"
        Broker[(Redis Pub/Sub)]
        Memory["MemoryManager <br /> (RedisJSON)"]
    end

    subgraph "Agent Layer"
        Agent1["Thinking Agent A <br /> e.g., GeminiCliAgent"]
        Agent2["Thinking Agent B <br /> e.g., RoleBasedOpencodeAgent"]
        AgentN["... and so on"]
    end

    subgraph "System Agents"
        Logger[LoggingAgent]
        Manager[AgentManager]
    end

    UserInput -- "Publish" --&gt; Broker
    Broker -- "Subscribe" --&gt; Agent1
    Broker -- "Subscribe" --&gt; Agent2
    Broker -- "Subscribe" --&gt; AgentN
    Broker -- "Subscribe" --&gt; Logger
    Broker -- "Subscribe" --&gt; Manager

    Agent1 -- "Publish" --&gt; Broker
    Agent2 -- "Publish" --&gt; Broker

    Agent1 -- "Read/Write" --&gt; Memory
    Agent2 -- "Read/Write" --&gt; Memory
    UserInput -- "Read/Write" --&gt; Memory
</pre>
</div>
<div class="column">
<ul>
<li><strong>UserInputAgent</strong>: ユーザーからのテキスト入力を受け取り、指定されたターゲットエージェントへメッセージを送信する。</li>
<li><strong>Thinking Agents</strong>: それぞれが特定の役割や能力を持つエージェント群である。LLM（Gemini、OpenAI等）と対話し、思考や応答生成を行う。</li>
<li><strong>LoggingAgent</strong>: システム内を流れる全てのメッセージを購読し、ファイルへ記録する。</li>
<li><strong>AgentManager</strong>: 各エージェントの稼働状況を監視する。</li>
<li><strong>Redis Pub/Sub</strong>: エージェント間のメッセージングを担うブローカーである。</li>
<li><strong>MemoryManager</strong>: RedisJSONを利用して、対話履歴（メモリ）やエージェントの状態を永続化・管理する。</li>
</ul>
</div>
</div>
<footer>第105回 関西CAE懇話会</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-footer="第105回 関西CAE懇話会" data-paginate="true" data-class="cc-by-sa" data-theme="blue" lang="en-US" class="cc-by-sa" data-marpit-pagination="17" style="--footer:第105回 関西CAE懇話会;--paginate:true;--class:cc-by-sa;--theme:blue;" data-marpit-pagination-total="28" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="%F0%9F%A4%96-ai-masa-%F0%9F%93%A6-%E3%83%90%E3%83%83%E3%82%B0%E3%82%B0%E3%83%A9%E3%83%B3%E3%83%89%E3%83%86%E3%82%AF%E3%83%8E%E3%83%AD%E3%82%B8%E3%83%BC"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f916.svg" data-marp-twemoji=""/> ai-masa <img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4e6.svg" data-marp-twemoji=""/> バッググランドテクノロジー</h1>
<h2 id="%E4%B8%BB%E3%81%AA%E6%8A%80%E8%A1%93">主な技術</h2>
<ul>
<li><a href="https://www.python.org/">Python 3.10+</a></li>
<li><a href="https://github.com/tmuxinator/tmuxinator">tmuxinator</a> — 協調基盤。マルチプロセス起動</li>
<li><a href="https://redis.io/">Redis 公式サイト</a> — 高速インメモリデータストア</li>
<li><a href="https://github.com/opencode-ai/opencode-cli">opencode-cli</a> - cli　llmエージェントのラッパー</li>
</ul>
<h3 id="redis--%E3%82%A8%E3%83%BC%E3%82%B8%E3%82%A7%E3%83%B3%E3%83%88%E3%81%AE%E9%80%9A%E4%BF%A1%E3%81%A8%E6%B0%B8%E7%B6%9A%E3%83%A1%E3%83%A2%E3%83%AA">Redis — エージェントの通信と永続メモリ</h3>
<ul>
<li>Pub/Sub: 各エージェントは独立プロセスでRedisのPublish/Subscribeを使い非同期にメッセージを送受信。疎結合で柔軟な連携が可能。</li>
<li>RedisJSON（永続メモリ）: 対話履歴やセッション情報をJSONで保存し、再起動後も文脈を復元してタスク継続が可能。</li>
</ul>
<h3 id="opencode--llm%E3%82%A8%E3%83%BC%E3%82%B8%E3%82%A7%E3%83%B3%E3%83%88%E3%81%AE%E3%83%84%E3%83%BC%E3%83%AB%E5%AE%9F%E8%A1%8C">Opencode — LLMエージェントのツール実行</h3>
<ul>
<li>ツール実行の付与: Opencode CLI経由でファイル操作やシェルコマンド等の「ツール」をLLMが利用可能にする。</li>
<li>バックエンドの: config/opencode/config.jsonで操作範囲を厳密に制限し、安全性を担保。</li>
<li>永続セッション: 起動時のセッションIDを一貫して使うことでエージェントは複雑なタスクを遂行できる。</li>
</ul>
<footer>第105回 関西CAE懇話会</footer>
</section>

<h1 id="%F0%9F%A4%96-ai-masa-%E4%BA%8B%E4%BE%8B%E8%A8%88%E7%AE%97%E3%81%AE%E4%BE%8B%E9%A1%8Ccavity-flow-1"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f916.svg" data-marp-twemoji=""/> ai-masa 事例）計算の例題(cavity flow)</h1>
<div class="columns-60-40">
<div class="column">
<p><strong>問題の概要:</strong><br />
2次元の正方形領域内における層流、非圧縮性流体の流れをシミュレートする古典的なCFDベンチマーク問題です。3つの固定壁と、一定の接線速度で移動する上壁で構成されます。これにより、キャビティ内に主要な渦が形成されるのが特徴です。</p>
<p><strong>物理現象:</strong> 層流、非圧縮性、ニュートン流体の流れ、運動量輸送、渦形成。<br />
<strong>支配方程式:</strong> 非圧縮性Navier-Stokes方程式（連続の式、運動量方程式）。<br />
<strong>計算領域:</strong> 2次元の正方形キャビティ。<br />
<strong>境界条件:</strong></p>
<ul>
<li><strong>上壁:</strong> 速度 <code>fixedValue</code> (指定された接線速度)、圧力 <code>zeroGradient</code>。</li>
<li><strong>その他3壁:</strong> 速度 <code>fixedValue (0 0 0)</code> (滑りなし条件)、圧力 <code>zeroGradient</code>。</li>
<li><strong>前後面 (2Dシミュレーションの場合):</strong> <code>empty</code>。<br />
<strong>初期条件:</strong> 全領域で速度 <code>(0 0 0)</code>、圧力 <code>0</code>。</li>
</ul>
</div>
<div class="column">
<img src="./data/cavity_diagram.png" height="500" />
</div>
</div>
<p>まぁまぁ。<strong>あなたなら何点つけますか？</strong></p>

<h1 id="%F0%9F%A4%96-ai-masa-%E4%BA%8B%E4%BE%8B%E8%A8%AD%E8%A8%88%E6%A4%9C%E8%A8%8E%E3%82%A8%E3%83%BC%E3%82%B8%E3%82%A7%E3%83%B3%E3%83%88%E3%81%AB%E9%96%A2%E3%81%99%E3%82%8B%E3%81%BE%E3%81%A8%E3%82%81"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f916.svg" data-marp-twemoji=""/> ai-masa 事例）設計検討エージェントに関するまとめ</h1>
<ul>
<li>
<p>設計検討エージェントをマルチエージェントシステムai-masaにて構築以下の計算について、確認できた。</p>
<ul>
<li>OpenFOAM cavity計算（順問題）</li>
<li>cavity caseにおける任意圧力となる壁面速度設計（逆問題）</li>
</ul>
</li>

<ul>
<li>OpenFOAMの計算</li>
<li>スクリプト生成による計算の自動化</li>
<li>レポート作成機能</li>
</ul>
</li>
<li>
<p>見つかった課題</p>

</ul>

<li>MCPサーバを使ったエージェント</li>

<h1 id="%E6%9C%80%E5%BE%8C%E3%81%AB--ai%E6%99%82%E4%BB%A3%E3%81%AE%E8%A8%AD%E8%A8%88%E8%80%85cae%E3%81%A8%E3%81%AF-1">最後に — AI時代の設計者CAEとは</h1>
<p>AI時代の設計者CAEは単なるツールではなく、迅速な設計判断・技術継承・組織的価値創出を担う存在といえる。</p>
<h3 id="%E8%A8%AD%E8%A8%88%E8%80%85%E3%81%AB%E3%81%A8%E3%81%A3%E3%81%A6">設計者にとって</h3>
<ul>
<li>優秀な設計アシスタント：短時間で傾向を示し、投資判断（やる価値があるか）を出す。</li>
<li>実務負荷を下げて試作・実験の判断を迅速化。アイデアの死蔵を防ぐ。</li>
</ul>
<h3 id="cae%E5%B0%82%E4%BB%BB%E8%80%85%E3%81%AB%E3%81%A8%E3%81%A3%E3%81%A6">CAE専任者にとって</h3>
<ul>
<li>技術の伝承先：手順やノウハウをAIで形式化・自動化し、若手や設計現場へ効率的に展開。</li>
<li>例外対応や高度検証に集中できるようになり、専門性をより高付加価値領域へ注力可能にする。</li>
</ul>
<h3 id="%E3%83%9E%E3%83%8D%E3%83%BC%E3%82%B8%E3%83%A3%E3%83%BC%E3%81%AB%E3%81%A8%E3%81%A3%E3%81%A6">マネージャーにとって</h3>
<ul>
<li>チームに必要なAIを見極めて導入・育成することで、メンバーの業務効率化とプロセス改善を図り、チームの継続的な能力向上を促進する。</li>
</ul>
<h3 id="%E7%B5%8C%E5%96%B6%E5%B1%A4%E3%81%AB%E3%81%A8%E3%81%A3%E3%81%A6">経営層にとって</h3>
<ul>
<li>競合他社やBigTechに勝つため、自社の強みを最大限に引き出した人とAIの融合した組織を作る必要がある。</li>
</ul>
